apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-web
  labels:
    app: forge-web
spec:
  # One table per game server (docs/MULTIPLAYER.md D-M1), and a running game lives in memory:
  # never two pods at once.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forge-web
  template:
    metadata:
      labels:
        app: forge-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: web
          image: forge-web:dev
          imagePullPolicy: Never  # loaded straight into minikube's runtime
          env:
            - name: JAVA_OPTS
              value: -Xmx3g
            # The control API's shared secret (PROTOCOL.md "Control API"); mtg-tracker holds the same one.
            # Created by `deploy/minikube.sh secret`, never committed.
            - name: FORGE_CONTROL_SECRET
              valueFrom:
                secretKeyRef:
                  name: forge-control
                  key: secret
          ports:
            - name: http
              containerPort: 7777
            - name: control
              containerPort: 7790
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: pics
              mountPath: /pics
              readOnly: true
          # Loading the card database takes a while; the table isn't up until then.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: control
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forge-data
        - name: pics
          persistentVolumeClaim:
            claimName: forge-pics
