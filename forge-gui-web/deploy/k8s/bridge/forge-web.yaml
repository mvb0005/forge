# The tunnel's /play route names forge-web in mtg-tracker's namespace on port 7780 (set in the
# Cloudflare dashboard, from when the server ran in Docker on the host). This keeps that name and
# points it at the game server in namespace forge, so the dashboard needs no change.
apiVersion: v1
kind: Service
metadata:
  name: forge-web
  namespace: mtgtracker
spec:
  type: ExternalName
  externalName: forge-web.forge.svc.cluster.local
  ports:
    - name: http
      port: 7780
