map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}
server {
  listen 8080;
  # Redirects keep the public host and port (not this pod's 8080).
  absolute_redirect off;
  # Table pods come and go: look each one up as it's asked for.
  resolver kube-dns.kube-system.svc.cluster.local valid=5s ipv6=off;

  # A game's replay: the table UI from the newest build (the spare), which fetches the file from the tracker.
  # The match id is only for the page; its pod may be long gone.
  location ~ "^/play/table/[0-9a-f]{16}/replay$" {
    return 302 $uri/$is_args$args;
  }
  location ~ "^/play/table/[0-9a-f]{16}/replay(/.*)$" {
    set $rest $1;
    proxy_pass http://viewer.forge.svc.cluster.local:7777$rest$is_args$args;
    proxy_set_header Host $host;
    # No spare for a moment (a game just took it): any table serves the UI.
    error_page 502 504 = @anytable;
  }
  location @anytable {
    proxy_pass http://tables.forge.svc.cluster.local:7777$rest$is_args$args;
    proxy_set_header Host $host;
  }
  location ~ "^/play/table/([0-9a-f]{16})(/|$)" {
    proxy_pass http://$1.tables.forge.svc.cluster.local:7777;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    # Nothing pings an idle table socket; a player thinking for a while keeps it.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    # The table's pod is gone: its game ended a while ago.
    error_page 502 504 = @gone;
  }
  location @gone {
    return 302 /play?notice=That%20game%20has%20ended;
  }
  location = /healthz {
    return 200 "ok\n";
  }
  location / {
    return 302 /play;
  }
}
