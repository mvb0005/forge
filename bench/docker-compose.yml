name: forge-bench

services:
  lgtm:
    image: grafana/otel-lgtm:0.34.0
    restart: unless-stopped
    ports:
      - "3000:3000" # Grafana
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    volumes:
      - ./lgtm/otelcol-config.yaml:/otel-lgtm/otelcol-config.yaml:ro
      - ./lgtm/tempo-config.yaml:/otel-lgtm/tempo-config.yaml:ro
      - ./grafana/forge-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/forge-dashboards.yaml:ro
      - ./grafana/dashboards:/otel-lgtm/forge-dashboards:ro
      - lgtm-data:/data
    environment:
      # each sim JVM is short-lived; without zero samples at series start, rate()/increase() miss its first games
      PROMETHEUS_EXTRA_ARGS: --enable-feature=created-timestamp-zero-ingestion --storage.tsdb.retention.time=1y
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 5s
      retries: 60

  forge-sim: &forge-sim
    build:
      context: ./forge-sim
      additional_contexts:
        res: ../forge-gui/res
        jar: ../forge-gui-desktop/target
    image: forge-sim:${FORGE_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      lgtm:
        condition: service_healthy
    deploy:
      replicas: ${SIM_REPLICAS:-1}
    cpus: ${SIM_CPUS:-4}
    environment: &sim-env
      JAVA_OPTS: ${JAVA_OPTS:--Xmx3g}
      # empty: each replica picks a random starting seed (printed in its log), so replicas play different games
      FORMAT: ${FORMAT:-commander}
      GAMES_PER_RUN: ${GAMES_PER_RUN:-3}
      GAME_TIMEOUT: ${GAME_TIMEOUT:-1800}
      SEED: ${SEED:-}
      ROUNDS: ${ROUNDS:-0}
      OTEL_SERVICE_NAME: forge-sim
      OTEL_RESOURCE_ATTRIBUTES: service.version=${FORGE_VERSION:-dev},forge.commit=${FORGE_COMMIT:-unknown}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      OTEL_METRIC_EXPORT_INTERVAL: "10000"
      OTEL_LOGS_EXPORTER: none
      # only what the benchmark needs: our @WithSpan markers, the metrics API, context across executors, JVM metrics
      OTEL_INSTRUMENTATION_COMMON_DEFAULT_ENABLED: "false"
      OTEL_INSTRUMENTATION_OPENTELEMETRY_API_ENABLED: "true"
      OTEL_INSTRUMENTATION_OPENTELEMETRY_INSTRUMENTATION_ANNOTATIONS_ENABLED: "true"
      OTEL_INSTRUMENTATION_EXECUTORS_ENABLED: "true"
      OTEL_INSTRUMENTATION_RUNTIME_TELEMETRY_ENABLED: "true"
    volumes:
      - ./matchups.txt:/bench/matchups.txt:ro
      - ./scenarios.txt:/bench/scenarios.txt:ro
      - ./states:/bench/states:ro

  # `bench.sh compare`: the same sim built from another commit (a git worktree in .baseline), on the same seeds
  forge-sim-baseline:
    <<: *forge-sim
    profiles: [compare]
    build:
      context: ./forge-sim
      additional_contexts:
        res: ./.baseline/forge-gui/res
        jar: ./.baseline/forge-gui-desktop/target
    image: forge-sim:${BASELINE_VERSION:-baseline}
    environment:
      <<: *sim-env
      OTEL_RESOURCE_ATTRIBUTES: service.version=${BASELINE_VERSION:-baseline},forge.commit=${BASELINE_COMMIT:-unknown}

volumes:
  # external: created by bench.sh and never deleted by `docker compose down -v`; see README "Data"
  lgtm-data:
    external: true
    name: forge-bench-data
