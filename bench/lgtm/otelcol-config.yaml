# Replaces the collector config shipped in grafana/otel-lgtm. Same pipelines, plus a spanmetrics
# connector so every span (all of them, before any sampling) becomes call-count and latency metrics,
# and tail sampling on what goes to Tempo.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus/collector:
    config:
      scrape_configs:
        - job_name: "opentelemetry-collector"
          scrape_interval: 15s
          static_configs:
            - targets: ["127.0.0.1:8888"]

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: "/ready"

connectors:
  spanmetrics:
    histogram:
      unit: ms
      explicit:
        buckets: [0.1ms, 0.25ms, 0.5ms, 1ms, 2.5ms, 5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s, 30s, 60s, 120s, 300s]
    dimensions:
      - name: forge.ai.stuck_at # only set on AiController.decisionTimeout
    exemplars:
      enabled: true
    metrics_flush_interval: 15s

processors:
  batch:
  # what Tempo stores: every trace with a slow span (the slow-decision table and exemplars need those) and 5% of
  # the rest. Span metrics come from the unsampled pipeline, so call counts and latencies stay exact.
  tail_sampling:
    decision_wait: 10s
    num_traces: 200000
    policies:
      - name: slow
        type: latency
        latency:
          threshold_ms: 250
      - name: sample-of-the-rest
        type: probabilistic
        probabilistic:
          sampling_percentage: 5

exporters:
  otlp_http/metrics:
    endpoint: http://127.0.0.1:9090/api/v1/otlp
    tls:
      insecure: true
  otlp_http/traces:
    endpoint: http://127.0.0.1:4418
    tls:
      insecure: true
  otlp_http/logs:
    endpoint: http://127.0.0.1:3100/otlp
    tls:
      insecure: true
  otlp_grpc/profiles:
    endpoint: http://127.0.0.1:4040
    tls:
      insecure: true

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [spanmetrics]
    traces/stored:
      receivers: [otlp]
      processors: [tail_sampling, batch]
      exporters: [otlp_http/traces]
    metrics:
      receivers: [otlp, prometheus/collector, spanmetrics]
      processors: [batch]
      exporters: [otlp_http/metrics]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/logs]
    profiles:
      receivers: [otlp]
      exporters: [otlp_grpc/profiles]
