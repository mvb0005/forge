# Replaces the Tempo config shipped in grafana/otel-lgtm 0.34.0. Changes: retention is explicit,
# and Tempo's own span metrics are off (the collector's spanmetrics connector already makes them, unsampled).
server:
  http_listen_port: 3200
  grpc_listen_port: 9096

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "127.0.0.1:4417"
        http:
          endpoint: "127.0.0.1:4418"

memberlist:
  bind_addr: [127.0.0.1]
  bind_port: 7947

querier:
  frontend_worker:
    frontend_address: 127.0.0.1:9096

storage:
  trace:
    backend: local
    wal:
      path: /data/tempo/wal
    local:
      path: /data/tempo/blocks

compactor:
  compaction:
    # traces are large (about 1 GB per 12 h of sims); metrics in Prometheus are kept for a year
    block_retention: 336h
